plugins {
    id 'org.springframework.boot' version '2.2.4.RELEASE'
    id 'io.spring.dependency-management' version '1.0.9.RELEASE'
    id 'java'
}

group = 'com.globant.brainwaves'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

ext {
    set('springCloudVersion', "Hoxton.RC2")
    set('AkkaVersion', "2.6.1")
    set('AlpakkaVersion', "1.1.2")
    set('AlpakkaKafkaVersion', "1.1.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    //implementation "com.lightbend.akka:akka-stream-alpakka-elasticsearch:${AlpakkaVersion}"
    //implementation "com.typesafe.akka:akka-stream-kafka:${AlpakkaKafkaVersion}"
    //implementation "com.typesafe.akka:akka-stream:${AkkaVersion}"
    //implementation "com.typesafe.akka:akka-actor-typed:${AkkaVersion}"
    //implementation "com.typesafe.akka:akka-actor:${AkkaVersion}"
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
}

test {
    useJUnitPlatform()
}
